name: Visuels TCG Republic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/trj.mjs', '.github/workflows/trj.yml']
  schedule:
    - cron: '41 5 * * 2'
permissions:
  contents: write
concurrency: trj
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/trj.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/trj.json
          git diff --cached --quiet || (git commit -m "Visuels TCG Republic : mise à jour" && (git push || (git pull --rebase && git push)))
