name: Sonde Cardmarket
on:
  push:
    branches: [main]
    paths: ['.github/scripts/probe-cm.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/probe-cm.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || (git commit -m "Sonde Cardmarket : résultat" && (git push || (git pull --rebase && git push)))
