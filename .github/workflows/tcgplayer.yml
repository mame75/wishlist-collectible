name: Photos TCGplayer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/tcgp.mjs', '.github/workflows/tcgplayer.yml']
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency: tcgp
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/tcgp.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/tcgp data/tcgpj data/cmjp
          git diff --cached --quiet || (git commit -m "Photos TCGplayer : mise à jour du catalogue" && git push)
