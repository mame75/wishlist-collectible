name: Visuels PriceCharting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/pc.mjs', '.github/workflows/pc.yml']
  schedule:
    - cron: '23 6 * * 3'
permissions:
  contents: write
concurrency: pc
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/pc.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/pcj.json data/pced.json data/pcy.json data/pc-bilan.json
          git diff --cached --quiet || (git commit -m "Visuels PriceCharting : mise à jour" && (git push || (git pull --rebase && git push)))
