name: Symboles d'extension
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/pksym.mjs', '.github/workflows/pksym.yml']
  schedule:
    - cron: '11 7 1 * *'
permissions:
  contents: write
concurrency: pksym
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/pksym.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Symboles d'extension : mise à jour" && (git push || (git pull --rebase && git push)))
