<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist Collectible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Première passe design — esprit Collectr : fond quasi noir, tuiles sombres arrondies, filtres à gauche,
   contrôles en pilule. Identité propre : accent jaune, typo Manrope. */
:root{
  --bg:#07080a;--surface:#111318;--surface2:#181b22;--inset:#0b0c10;--line:#22252d;--line2:#2e323c;
  --ink:#f3f4f6;--muted:#8e94a3;--faint:#5d6270;
  --accent:#ffcf3a;--accent-ink:#1a1400;--accent-soft:rgba(255,207,58,.12);
  --pkm:#ffcf3a;--ygo:#9b8cff;
  --danger:#ff6b6b;--radius:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:0 max(3vw,14px)}
.sp{flex:1}

/* En-tête */
header{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{flex:none}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.02em;margin-top:-3px}
nav{display:flex;gap:2px;margin-left:18px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{background:none;border:0;padding:0 16px;height:34px;border-radius:999px;color:var(--muted);font-weight:700;cursor:pointer;font-size:14px}
nav button.on{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
nav button em{font-style:normal;font-size:10px;color:var(--faint);margin-left:5px;vertical-align:1px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:#40444f;background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#ffd95e}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible,.tile:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{height:42px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:0 14px;font-size:15px}
.field:hover{border-color:#40444f}
.field.grow{flex:1 1 220px}
.field.num{width:100%}
select.field{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
select.field option{background:var(--surface)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:0 14px;height:34px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button[disabled]{opacity:.35;cursor:default}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .field{width:100%;padding-left:40px}

/* Bandeau de synthèse */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:30px 0 24px;border-bottom:1px solid var(--line)}
.hero .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.hero .val{font-size:clamp(36px,5vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.hero .meta b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.split{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--surface2);margin-top:14px;max-width:420px}
.split i{display:block;height:100%}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hero.shared .lbl{color:var(--accent)}

/* Mise en page : filtres + grille */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:24px 0 80px}
.side{position:sticky;top:92px;align-self:start;display:grid;gap:22px}
.fgroup h4{margin:0 0 9px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;height:34px;padding:0 13px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#40444f;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip span{font-size:11px;color:var(--faint);font-weight:700}
.chip.on span{color:var(--accent)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reset{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.filtersToggle{display:none}
.gridhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.gridhead .count{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}

/* Grille de cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left;color:var(--ink)}
.tile:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,207,58,.08)}
.img{position:relative;aspect-ratio:63/88;border-radius:10px;overflow:hidden;background:var(--inset)}
.tile .img{box-shadow:0 10px 24px -14px rgba(0,0,0,.9)}
.img img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.img .ph{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:var(--muted);font-size:12px;
  background:radial-gradient(circle at 50% 42%,#20232b 0 20%,transparent 21%),repeating-linear-gradient(135deg,#15171d 0 8px,#121419 8px 16px);border:1px solid var(--line2);border-radius:10px}
.img .ph span{display:grid;gap:4px;background:rgba(7,8,10,.86);padding:9px 11px;border-radius:10px}
.img .ph b{color:var(--ink);font-size:13px;line-height:1.2}
.img .ph small{font-size:11px}
.img .ph em{font-style:normal;font-size:10px;opacity:.8}
.badges{position:absolute;z-index:2;left:7px;top:7px;right:7px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(7,8,10,.82);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.bdg.grade{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tinfo{display:grid;gap:2px;padding:0 2px}
.tname{font-weight:800;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub.faint{color:var(--faint)}
.tprice{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;padding:8px 2px 0;border-top:1px solid var(--line)}
.tprice b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.tprice span{font-size:11px;color:var(--faint);font-weight:700;white-space:nowrap}
.empty{grid-column:1/-1;border:1px dashed var(--line2);border-radius:var(--radius);padding:56px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:19px}
.empty .btn{margin-top:16px}

/* Collection (travaux) */
.wip{margin:70px auto;max-width:520px;text-align:center;padding:44px 24px;border:1px dashed var(--line2);border-radius:20px}
.wip .cone{width:56px;height:56px;margin:0 auto 16px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--surface2) 10px 20px);border-radius:14px}

/* Modales */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.scrim.open{display:flex}
.modal{width:min(1000px,100%);background:#0d0f13;border:1px solid var(--line2);border-radius:22px;padding:22px;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.modal.sm{width:min(760px,100%)}
.mhead{display:flex;align-items:center;gap:10px;margin:-2px 0 18px}
.mhead h2{margin:0;font-size:21px;letter-spacing:-.02em}
.x{margin-left:auto;width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.x:hover{color:var(--ink)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;max-height:60vh;overflow:auto;padding:2px 4px 2px 2px}
.results .tile{padding:8px 8px 10px;gap:8px}
.results .tname{font-size:13.5px}
.results .tprice b{font-size:15px}
.status{color:var(--muted);padding:22px 0;text-align:center}
.detail{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:26px}
.detail .img{max-width:280px;box-shadow:0 20px 50px -20px rgba(0,0,0,.95)}
.detail h3{margin:0 0 2px;font-size:24px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:10px 0 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.form{display:grid;gap:14px;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.l{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:80;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.sharebox{width:100%}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;gap:16px;padding-top:16px}
  .side{position:static;display:none;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .side.open{display:grid}
  .filtersToggle{display:inline-flex}
}
@media(max-width:640px){
  .top{height:auto;flex-wrap:wrap;padding:10px 0;gap:10px}
  nav{margin-left:0;order:3}
  #shareBtn{order:2}
  .logo small{display:none}
  .hero{grid-template-columns:1fr;padding:22px 0 18px}
  .hero .acts{justify-content:flex-start}
  .detail{grid-template-columns:1fr}
  .detail .img{max-width:230px;margin:0 auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:7px 7px 10px;gap:8px}
  .tname{font-size:13.5px}
  .tprice b{font-size:16px}
  .modal{padding:16px;border-radius:18px}
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="logo">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><rect x="9" y="2" width="19" height="27" rx="4" fill="#2e323c" transform="rotate(10 18 15)"/><rect x="2" y="4" width="19" height="27" rx="4" fill="#ffcf3a" transform="rotate(-6 11 17)"/><path d="M11.5 12.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#1a1400" transform="rotate(-6 11 17)"/></svg>
      <div>Wishlist Collectible<small>Pokémon · Yu-Gi-Oh!</small></div>
    </div>
    <nav id="nav">
      <button data-view="wishlist" class="on">Wishlist</button>
      <button data-view="collection">Collection<em>bientôt</em></button>
    </nav>
    <div class="sp"></div>
    <button class="btn ghost" id="shareBtn">Partager</button>
    <button class="btn primary" id="addBtn">+ Ajouter une carte</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<!-- Modale : recherche / ajout -->
<div class="scrim" id="addScrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="mhead"><h2 id="addTitle">Ajouter une carte</h2><button class="x" data-close aria-label="Fermer">×</button></div>
    <div id="addBody"></div>
  </div>
</div>

<!-- Modale : détail d'une carte -->
<div class="scrim" id="detScrim">
  <div class="modal sm" role="dialog" aria-modal="true">
    <div class="mhead"><h2 id="detTitle">Carte</h2><button class="x" data-close aria-label="Fermer">×</button></div>
    <div id="detBody"></div>
  </div>
</div>

<!-- Modale : partage -->
<div class="scrim" id="shareScrim">
  <div class="modal sm" role="dialog" aria-modal="true">
    <div class="mhead"><h2>Partager ma wishlist</h2><button class="x" data-close aria-label="Fermer">×</button></div>
    <div id="shareBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
{
/* ========= Config ========= */
const GAMES = {
  pkm: {label:'Pokémon', langs:[['fr','FR'],['en','EN'],['ja','JP'],['de','DE'],['it','IT'],['es','ES']]},
  ygo: {label:'Yu-Gi-Oh!', langs:[['fr','FR'],['en','EN'],['de','DE'],['it','IT'],['pt','PT'],['ja','JP']]}
};
const GRADERS = ['PSA','CGC','BGS','PCA','Collect Aura','SGC'];
const GRADES = ['10','9.5','9','8.5','8','7.5','7','6','5','4','3','2','1'];
const STORE_KEY = 'wlc.v1';
// Visuels ajoutés à la main pour les cartes Pokémon sans image dans TCGdex (fichiers dans images/pokemon/)
const CUSTOM_IMG = { '2024sv-1': 'images/pokemon/2024sv-1.jpg' };
const PAGE = 24;

/* ========= Utilitaires ========= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (n == null || isNaN(n)) ? '—' : n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isNaN(n) ? null : n; };
const langLabel = (g,l) => (GAMES[g].langs.find(x=>x[0]===l)||[l,l.toUpperCase()])[1];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
async function mapLimit(items, limit, fn){
  const out = new Array(items.length); let i = 0;
  const workers = Array.from({length:Math.min(limit, items.length)}, async () => {
    while (i < items.length){ const k = i++; try { out[k] = await fn(items[k], k); } catch(e){ out[k] = null; } }
  });
  await Promise.all(workers); return out;
}
const b64e = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = str => decodeURIComponent(escape(atob(str.replace(/-/g,'+').replace(/_/g,'/'))));

/* ========= Stockage local ========= */
let state = { owner:'', items:[] };
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.items)) state = s; } catch(e){} }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ toast('Sauvegarde impossible dans ce navigateur'); } }

/* ========= Cache local (24 h) =========
   Garde dans le navigateur les cartes et recherches déjà consultées : moins d'appels aux bases,
   donc des recherches plus rapides et moins de risques d'être bloqué. Les prix Cardmarket ne changent qu'une fois par jour. */
// Changer la version vide la mémoire existante (à faire quand le format des cartes gardées change)
const CACHE_PREFIX = 'wlc.c2.';
try { for (let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if (k && k.startsWith('wlc.c.')) localStorage.removeItem(k); } } catch(e){}
const CACHE_TTL = 24 * 3600 * 1000;
let forceFresh = false;   // vrai pendant « Actualiser les prix »
function cacheGet(key){
  if (forceFresh) return undefined;
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + key); if (!raw) return undefined;
    const e = JSON.parse(raw);
    if (Date.now() - e.t > CACHE_TTL){ localStorage.removeItem(CACHE_PREFIX + key); return undefined; }
    return e.v;
  } catch(e){ return undefined; }
}
function cacheSet(key, v){
  const s = JSON.stringify({t: Date.now(), v});
  try { localStorage.setItem(CACHE_PREFIX + key, s); }
  catch(e){ cachePrune(true); try { localStorage.setItem(CACHE_PREFIX + key, s); } catch(e2){} }
}
function cachePrune(all){
  try {
    for (let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i); if (!k || !k.startsWith(CACHE_PREFIX)) continue;
      if (all){ localStorage.removeItem(k); continue; }
      try { if (Date.now() - JSON.parse(localStorage.getItem(k)).t > CACHE_TTL) localStorage.removeItem(k); } catch(e){ localStorage.removeItem(k); }
    }
  } catch(e){}
}
async function cached(key, fn){
  const hit = cacheGet(key);
  if (hit !== undefined) return hit;
  const v = await fn();
  if (v != null && !(Array.isArray(v) && !v.length)) cacheSet(key, v);   // on ne garde pas les résultats vides (peut-être une erreur passagère)
  return v;
}

/* ========= Traduction des noms de cartes japonaises =========
   PokeAPI donne, pour chaque numéro de Pokédex, le nom japonais et le nom français de l'espèce.
   On remplace l'espèce dans le nom de la carte et on traduit les préfixes / suffixes connus. */
async function speciesNames(dex){
  return cached(`sp:${dex}`, async () => {
    const r = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${dex}`);
    if (!r.ok) return null;
    const j = await r.json(), n = l => (j.names.find(x => x.language.name === l) || {}).name;
    return { fr: n('fr'), ja: n('ja') || n('ja-Hrkt') };
  });
}
const JA_PREFIX = { 'かがやく':[ '', ' radieux' ], 'メガ':[ 'Méga-', '' ], 'ダーク':[ '', ' obscur' ], 'わるい':[ '', ' obscur' ], '暗い':[ '', ' obscur' ], '輝く':[ '', ' brillant' ], 'ガラル':[ '', ' de Galar' ],
  'アローラ':[ '', " d'Alola" ], 'ヒスイ':[ '', ' de Hisui' ], 'パルデア':[ '', ' de Paldea' ], 'ロケット団の':[ '', ' de la Team Rocket' ] };
function frSuffix(s){
  s = s.trim();
  if (!s) return '';
  let m;
  if ((m = s.match(/^([XY])(ex|EX)$/))) return ` ${m[1]}-${m[2]}`;
  if (/^(ex|EX|GX|TAG ?TEAM)$/.test(s)) return '-' + s;
  if (/^(V|VMAX|VSTAR|V-UNION|BREAK|LEGEND|☆|◇|δ|プリズムスター)$/.test(s)) return ' ' + s.replace('プリズムスター', '◇');
  if (/^LV\.?X$/i.test(s)) return ' NIV.X';
  return null;   // suffixe inconnu : on ne traduit pas
}
async function translateJa(name, dexIds){
  if (!name || !dexIds || !dexIds.length || dexIds.length > 3) return null;
  const sp = await Promise.all(dexIds.map(d => speciesNames(d).catch(() => null)));
  if (sp.some(x => !x || !x.ja || !x.fr)) return null;
  let rest = name, pre = '', post = '';
  // Préfixe connu (かがやく, メガ…) ou propriétaire (« X の ») qu'on ne sait pas traduire
  for (const k of Object.keys(JA_PREFIX)) if (rest.startsWith(k)){ [pre, post] = JA_PREFIX[k]; rest = rest.slice(k.length); break; }
  if (rest.indexOf(sp[0].ja) !== 0) return null;   // texte inconnu avant l'espèce (ex. nom d'un dresseur) : on garde le japonais
  let fr = sp.map(x => x.fr).join(' & ');
  let tail = rest;
  for (const x of sp){ const i = tail.indexOf(x.ja); if (i < 0) return null; tail = tail.slice(i + x.ja.length).replace(/^[&＆]/, ''); }
  const suf = frSuffix(tail);
  if (suf === null) return null;
  return pre + fr + post + suf;
}

/* ========= Sources de données ========= */
const API = {
  async getJSON(url){
    const r = await fetch(url);
    if (r.status === 400 || r.status === 404) return null;     // YGOPRODeck renvoie 400 quand rien ne correspond
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  /* --- Pokémon : TCGdex (prix Cardmarket en €) --- */
  pkmNorm(c, lang){
    const cm = c.pricing && c.pricing.cardmarket || {};
    const pick = (...k) => { for (const x of k){ const v = num(cm[x]); if (v != null && v > 0) return v; } return null; };
    const official = c.set && c.set.cardCount && c.set.cardCount.official;
    return {
      game:'pkm', id:c.id, lang, name:c.name,
      img: c.image ? c.image + '/low.webp' : (CUSTOM_IMG[c.id] || null),
      imgHi: c.image ? c.image + '/high.webp' : (CUSTOM_IMG[c.id] || null),
      set: c.set ? c.set.name : '', num: c.localId + (official ? '/' + official : ''),
      rarity: c.rarity || '',
      prices: { normal: pick('avg30','avg','trend'), reverse: pick('avg30-holo','avg-holo','trend-holo') },
      prints: null, cmId: cm.idProduct || null, nameEn: null, dexId: c.dexId || [],
      priceDate: cm.updated || null
    };
  },
  pkmSearch(q, lang){ return cached(`ps:${lang}:${q.toLowerCase()}`, () => this._pkmSearch(q, lang)); },
  async _pkmSearch(q, lang){
    const list = await this.getJSON(`https://api.tcgdex.net/v2/${lang}/cards?name=${encodeURIComponent(q)}`);
    if (!Array.isArray(list)) return [];
    // Cartes avec visuel d'abord (tri stable : l'ordre de la base est conservé)
    const has = x => x.image || CUSTOM_IMG[x.id] ? 1 : 0;
    return list.map(b => ({id:b.id, name:b.name, image:b.image})).sort((a, b) => has(b) - has(a));
  },
  pkmCard(id, lang){ return cached(`pc3:${lang}:${id}`, () => this._pkmCard(id, lang)); },
  async _pkmCard(id, lang){
    const c = await this.getJSON(`https://api.tcgdex.net/v2/${lang}/cards/${encodeURIComponent(id)}`);
    if (!c) return null;
    const card = this.pkmNorm(c, lang);
    if (lang === 'ja'){
      const fr = await translateJa(card.name, card.dexId).catch(() => null);
      if (fr){ card.nameJa = card.name; card.name = fr; }
    }
    // Pas de visuel dans cette langue : on essaie le visuel anglais de la même carte
    if (!card.img && lang !== 'en'){
      const en = await this.getJSON(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(id)}`).catch(() => null);
      if (en && en.image){ card.img = en.image + '/low.webp'; card.imgHi = en.image + '/high.webp'; card.imgLang = 'en'; }
    }
    return card;
  },
  /* --- Yu-Gi-Oh! : YGOPRODeck (prix Cardmarket en €) --- */
  ygoNorm(c, lang){
    const im = (c.card_images || [])[0] || {};
    const p = (c.card_prices || [])[0] || {};
    return {
      game:'ygo', id:String(c.id), lang, name:c.name,
      img: im.image_url_small || null, imgHi: im.image_url || null,
      set:'', num:'', rarity:'',
      prices: { normal: num(p.cardmarket_price) || null, reverse:null },
      prints: (c.card_sets || []).map(s => ({code:s.set_code, set:s.set_name, rarity:s.set_rarity})),
      cmId: null, nameEn: c.name_en || c.name,
      priceDate: null
    };
  },
  ygoUrl(params, lang){ return `https://db.ygoprodeck.com/api/v7/cardinfo.php?${params}${lang && lang !== 'en' ? '&language=' + lang : ''}`; },
  ygoSearch(q, lang){ return cached(`ys2:${lang}:${q.toLowerCase()}`, () => this._ygoSearch(q, lang)); },
  async _ygoSearch(q, lang){
    const get = l => this.getJSON(this.ygoUrl(`fname=${encodeURIComponent(q)}&num=60&offset=0`, l)).then(r => r && Array.isArray(r.data) ? r.data : []);
    if (lang === 'en') return (await get('en')).map(c => this.ygoNorm(c, lang));
    // Les cartes récentes n'ont pas encore de nom traduit chez YGOPRODeck : elles n'apparaissent
    // qu'en anglais. On cherche donc aussi en anglais et on ajoute celles qui manquent (nom anglais affiché).
    const [loc, en] = await Promise.all([get(lang), get('en').catch(() => [])]);
    const seen = new Set(loc.map(c => String(c.id)));
    return loc.map(c => this.ygoNorm(c, lang))
      .concat(en.filter(c => !seen.has(String(c.id))).map(c => ({ ...this.ygoNorm(c, lang), noLocalName: true })));
  },
  ygoCard(id, lang){ return cached(`yc:${lang}:${id}`, () => this._ygoCard(id, lang)); },
  async _ygoCard(id, lang){
    const r = await this.getJSON(this.ygoUrl(`id=${encodeURIComponent(id)}`, lang));
    return r && r.data && r.data[0] ? this.ygoNorm(r.data[0], lang) : null;
  },
  card(game, id, lang){ return game === 'pkm' ? this.pkmCard(id, lang) : this.ygoCard(id, lang); }
};

// Identifiants de langue Cardmarket (filtre des offres sur la fiche produit)
const CM_LANG = { en:1, fr:2, de:3, es:4, it:5, ja:7, pt:8 };
// Pokémon : fiche exacte via l'identifiant Cardmarket fourni par TCGdex.
// Yu-Gi-Oh! : recherche par code d'impression (ex. CT13-EN003) qui mène à la bonne carte, sinon par nom anglais.
function cmUrl(it){
  if (it.cmLink) return it.cmLink;   // lien collé par l'utilisateur : c'est la fiche exacte
  const base = 'https://www.cardmarket.com/fr/';
  if (it.game === 'pkm'){
    if (it.cmId){
      const lg = CM_LANG[it.lang];
      return `${base}Pokemon/Products?idProduct=${encodeURIComponent(it.cmId)}${lg ? '&language=' + lg : ''}`;
    }
    return `${base}Pokemon/Products/Search?searchString=${encodeURIComponent(it.name)}`;
  }
  const q = it.printCode || it.nameEn || it.name;
  return `${base}YuGiOh/Products/Search?searchString=${encodeURIComponent(q)}`;
}
function ebayUrl(it){
  const q = [it.name, it.num || it.printCode, it.graded ? it.grader + ' ' + it.grade : ''].filter(Boolean).join(' ');
  return `https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(q)}`;
}


/* ========= Import depuis un lien Cardmarket =========
   On ne peut pas lire la page Cardmarket (pas d'accès ouvert) : on déduit la carte du lien lui-même
   (jeu, extension, nom, numéro ou rareté, langue) puis on la retrouve dans TCGdex / YGOPRODeck. */
const CM_LANG_REV = Object.fromEntries(Object.entries(CM_LANG).map(([k, v]) => [String(v), k]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const words = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter(Boolean);
// Mots-clés en plus pour les séries de promos, nommées différemment chez Cardmarket et TCGdex
const SET_ALIASES = { svp:'scarlet violet', swshp:'sword shield', smp:'sun moon', xyp:'xy', bwp:'black white', dpp:'diamond pearl',
  hgssp:'heartgold soulsilver', mep:'mega evolution', basep:'wizards', np:'nintendo' };
const stem = w => w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w;
const isPocket = id => /^(A\d+[a-z]?|B\d+[a-z]?|P-[AB])$/.test(id);   // séries TCG Pocket (cartes numériques)
function overlap(a, b){ const A = new Set(a), B = new Set(b); if (!A.size || !B.size) return 0;
  let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return i / new Set([...A, ...B]).size; }

function parseCmLink(raw){
  let u; try { u = new URL(raw.trim()); } catch(e){ return null; }
  if (!/cardmarket\.com$/i.test(u.hostname)) return null;
  const seg = u.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const i = seg.findIndex(x => /^(Pokemon|YuGiOh)$/i.test(x));
  if (i < 0 || !/^Products$/i.test(seg[i+1] || '') || !/^Singles$/i.test(seg[i+2] || '') || !seg[i+3] || !seg[i+4]) return null;
  return { game: /^pokemon$/i.test(seg[i]) ? 'pkm' : 'ygo', expansion: seg[i+3], slug: seg[i+4],
           lang: CM_LANG_REV[u.searchParams.get('language')] || null, url: u.href };
}

let enSets = null;
async function getEnSets(){
  if (enSets) return enSets;
  const list = await cached('sets:en', () => API.getJSON('https://api.tcgdex.net/v2/en/sets'));
  enSets = Object.fromEntries((list || []).map(s => [s.id, s.name]));
  return enSets;
}

// Renvoie { card } si la carte est trouvée avec certitude, sinon { candidates: [cartes] }
async function matchPkm(L, lang){
  const segs = L.slug.split('-').filter(x => !/^V\d+$/i.test(x));
  const code = segs[segs.length - 1] || '';
  const cnum = (code.match(/(\d+)$/) || [])[1];
  const nameTok = words(segs.slice(0, -1).join(' '));
  const expTok = words(L.expansion).filter(w => w !== 'ex').map(stem);
  const [briefs, sets] = await Promise.all([API.pkmSearch(segs[0], 'en'), getEnSets()]);
  const scored = briefs.filter(b => !isPocket(b.id.slice(0, b.id.lastIndexOf('-')))).map(b => {
    const k = b.id.lastIndexOf('-'), setId = b.id.slice(0, k), local = b.id.slice(k + 1);
    const ld = (local.match(/(\d+)$/) || [])[1];
    const numOk = !!cnum && !!ld && +ld === +cnum;
    const setScore = overlap(expTok, words((sets[setId] || setId) + ' ' + (SET_ALIASES[setId] || '')).filter(w => w !== 'ex').map(stem));
    const nameScore = overlap(nameTok, words(b.name));
    return { b, numOk, setScore, score: (numOk ? 2 : 0) + setScore * 1.5 + nameScore };
  }).sort((a, b) => b.score - a.score);
  if (!scored.length) return { candidates: [] };
  const top = scored[0], second = scored[1];
  const load = async id => (await API.pkmCard(id, lang)) || (await API.pkmCard(id, 'en').then(c => c && { ...c, lang }));
  if (top.numOk && top.setScore >= 0.5 && !(second && second.numOk && second.setScore >= top.setScore)){
    const card = await load(top.b.id);
    if (card) return { card };
  }
  const cands = (await mapLimit(scored.slice(0, 12), 4, x => load(x.b.id))).filter(Boolean);
  return { candidates: cands };
}

const YGO_RARITIES = ['Quarter-Century-Secret-Rare','Platinum-Secret-Rare','Prismatic-Secret-Rare','Starlight-Rare','Collectors-Rare','Ultimate-Rare',
  'Ghost-Rare','Secret-Rare','Ultra-Rare','Super-Rare','Gold-Rare','Premium-Gold-Rare','Parallel-Rare','Mosaic-Rare','Starfoil-Rare','Shatterfoil-Rare',
  'Short-Print','Super-Short-Print','Common','Rare'];
async function matchYgo(L, lang){
  let name = L.slug, rarity = null;
  const m = L.slug.match(/^(.*?)-V\d+-(.+)$/);
  if (m){ name = m[1]; rarity = m[2]; }
  else { const r = YGO_RARITIES.find(r => L.slug.toLowerCase().endsWith('-' + r.toLowerCase()));
         if (r){ name = L.slug.slice(0, -(r.length + 1)); rarity = r; } }
  const target = norm(name);
  const fetchList = async params => cached(`yl:${params}`, () =>
    API.getJSON(API.ygoUrl(params, 'en')).then(r => r && Array.isArray(r.data) ? r.data : []));
  // 1) toutes les cartes de l'extension, 2) sinon recherche par le mot le plus distinctif du nom
  let list = await fetchList(`cardset=${encodeURIComponent(L.expansion.replace(/-/g, ' '))}`).catch(() => []);
  let hit = list.find(c => norm(c.name) === target);
  if (!hit){
    const w = name.split('-').sort((a, b) => b.length - a.length)[0];
    list = await fetchList(`fname=${encodeURIComponent(w)}&num=60&offset=0`).catch(() => []);
    hit = list.find(c => norm(c.name) === target);
  }
  const toCard = async c => {
    const loc = lang !== 'en' ? await API.ygoCard(String(c.id), lang).catch(() => null) : null;
    return loc || API.ygoNorm(c, lang);
  };
  if (!hit){
    const nameTok = words(name);
    const cands = list.map(c => ({ c, s: overlap(nameTok, words(c.name)) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 12);
    return { candidates: await Promise.all(cands.map(x => toCard(x.c))) };
  }
  const exp = norm(L.expansion);
  const sets = hit.card_sets || [];
  const print = sets.find(s => norm(s.set_name) === exp && (!rarity || norm(s.set_rarity) === norm(rarity))) || sets.find(s => norm(s.set_name) === exp);
  return { card: await toCard(hit), printCode: print ? print.set_code : '' };
}

const itemMarket = it => marketOf(it.game, it.lang);
function applyFilters(items, skip){
  const q = filters.q.trim().toLowerCase();
  const min = num(filters.min), max = num(filters.max);
  let out = items.map((it, i) => ({it, i})).filter(({it}) => {
    if (skip !== 'game' && filters.game !== 'all' && it.game !== filters.game) return false;
    if (skip !== 'market' && filters.market !== 'all' && itemMarket(it) !== filters.market) return false;
    if (skip !== 'cond' && filters.cond !== 'all' && (filters.cond === 'graded') !== !!it.graded) return false;
    if (q && !(`${it.name} ${it.nameJa || ''} ${it.set} ${it.num} ${it.printCode}`.toLowerCase().includes(q))) return false;
    const p = shownPrice(it);
    if (min != null && (p == null || p < min)) return false;
    if (max != null && (p == null || p > max)) return false;
    return true;
  });
  const by = {
    added: (a,b) => b.it.addedAt - a.it.addedAt,
    'price-desc': (a,b) => (shownPrice(b.it) ?? -1) - (shownPrice(a.it) ?? -1),
    'price-asc': (a,b) => (shownPrice(a.it) ?? 1e9) - (shownPrice(b.it) ?? 1e9),
    name: (a,b) => a.it.name.localeCompare(b.it.name, 'fr')
  }[filters.sort];
  return out.sort(by);
}

// Groupe de filtres en pastilles, avec le nombre de cartes de chaque option

  $('#grid').onclick = e => { const t = e.target.closest('.tile'); if (t) openDetail(+t.dataset.i); };

/* ---- Ajout : étape 1, recherche ---- */
// Marchés : International (mêmes cartes, mêmes visuels en FR/EN/DE…) et Asie / OCG (cartes et impressions différentes)
const MARKETS = {
  pkm: { intl:['fr','en','de','it','es'], asia:['ja'] },
  ygo: { intl:['fr','en','de','it','pt'], asia:[] }
};
const marketOf = (game, lang) => MARKETS[game].asia.includes(lang) ? 'asia' : 'intl';
const MARKET_LABEL = { intl:'TCG', asia:'OCG' };
const hasCJK = s => /[぀-ヿ㐀-鿿가-힯]/.test(s);
const newGroup = () => ({ briefs:[], cards:[], shown:0, loaded:false, loading:false });

let search = { game:'pkm', q:'', market:'intl', groups:{ intl:newGroup(), asia:newGroup() }, link:null, linkCards:[], token:0 };

function renderSearch(){
  const s = search;
  $('#addTitle').textContent = 'Ajouter une carte';
  $('#addBody').innerHTML = `
    <form class="row" id="sform">
      <div class="seg" id="sgame">
        <button type="button" data-g="pkm" class="${s.game==='pkm'?'on':''}">Pokémon</button>
        <button type="button" data-g="ygo" class="${s.game==='ygo'?'on':''}">Yu-Gi-Oh!</button>
      </div>
      <input class="field grow" id="sq" type="search" placeholder="${s.game==='pkm' ? 'Ex. Dracaufeu, Charizard, Pikachu…' : 'Ex. Magicien Sombre, Dark Magician…'}" value="${esc(s.q)}" autocomplete="off">
      <button class="btn primary" type="submit">Rechercher</button>
    </form>
    <form class="row" id="lform" style="margin-top:10px">
      <input class="field grow" id="lurl" type="url" placeholder="… ou colle un lien Cardmarket (fiche d'une carte)" autocomplete="off">
      <button class="btn" type="submit">Importer</button>
    </form>
    <div class="hint" style="margin-top:8px">Nom en français ou en anglais${s.game==='pkm' ? ' (ou en japonais)' : ''}. Tu choisiras la langue exacte de la carte à l'étape suivante.</div>
    <div id="sres"></div>`;
  $('#sgame').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.game = b.dataset.g;
    s.q = ''; s.link = null; s.groups = { intl:newGroup(), asia:newGroup() }; s.market = 'intl'; renderSearch(); };
  $('#sform').onsubmit = e => { e.preventDefault(); s.q = $('#sq').value.trim(); if (s.q){ s.link = null; runSearch(); } };
  $('#lform').onsubmit = e => { e.preventDefault(); importLink($('#lurl').value); };
  renderResults();
  setTimeout(() => $('#sq') && $('#sq').focus(), 30);
}

async function importLink(raw){
  const s = search, L = parseCmLink(raw || '');
  if (!L){ renderResults('Ce lien ne ressemble pas à une fiche de carte Cardmarket (Pokémon ou Yu-Gi-Oh!). Ouvre la fiche de la carte et copie son adresse.'); return; }
  const tok = ++s.token;
  const lang = L.lang || 'fr';
  s.game = L.game; s.link = { url: L.url }; s.q = ''; s.linkCards = [];
  renderSearch(); $('#lurl').value = L.url;
  renderResults('Recherche de la carte du lien…');
  let res;
  try { res = L.game === 'pkm' ? await matchPkm(L, lang) : await matchYgo(L, lang); }
  catch(e){ if (tok === s.token) renderResults('Impossible de joindre la base de cartes. Réessaie dans un instant.'); return; }
  if (tok !== s.token) return;
  if (res.card){ renderConfigure(res.card, { cmLink: L.url, printCode: res.printCode || '' }); return; }
  s.linkCards = res.candidates;
  if (!s.linkCards.length){ renderResults('Carte introuvable dans nos bases à partir de ce lien. Essaie la recherche par nom.'); return; }
  renderResults();
}

// Fusionne les résultats FR et EN : une seule entrée par carte (FR en priorité, même visuel)
function mergeIntl(fr, en){
  const map = new Map();
  fr.forEach(b => map.set(b.id, { ...b, lang:'fr' }));
  en.forEach(b => { const x = map.get(b.id);
    if (x){ if (!x.image && b.image) x.image = b.image; }
    else map.set(b.id, { ...b, lang:'en' }); });
  const has = x => x.image || CUSTOM_IMG[x.id] ? 1 : 0;
  return [...map.values()].sort((a, b) => has(b) - has(a));
}

async function runSearch(){
  const s = search, tok = ++s.token;
  s.groups = { intl:newGroup(), asia:newGroup() };
  s.market = s.game === 'pkm' && hasCJK(s.q) ? 'asia' : 'intl';
  renderResults('Recherche…');
  try {
    if (s.game === 'pkm'){
      if (hasCJK(s.q)){
        s.groups.asia.briefs = (await API.pkmSearch(s.q, 'ja')).map(b => ({ ...b, lang:'ja' }));
        s.groups.intl.loaded = true;
        await loadMore('asia', tok);
      } else {
        const [fr, en] = await Promise.all([API.pkmSearch(s.q, 'fr'), API.pkmSearch(s.q, 'en').catch(() => [])]);
        if (tok !== s.token) return;
        s.groups.intl.briefs = mergeIntl(fr, en);
        await loadMore('intl', tok);
        if (tok !== s.token) return;
        renderResults();
        findAsia(tok);   // en arrière-plan : versions japonaises du même Pokémon
        return;
      }
    } else {
      const g = s.groups.intl;
      g.cards = await API.ygoSearch(s.q, 'fr'); g.briefs = g.cards; g.shown = g.cards.length; g.loaded = true;
      s.groups.asia.loaded = true;
    }
  } catch(e){
    if (tok === s.token) renderResults('Impossible de joindre la base de cartes. Vérifie ta connexion et réessaie.');
    return;
  }
  if (tok === s.token) renderResults();
}

// Les noms japonais ne ressemblent pas aux noms FR/EN : on passe par le numéro de Pokédex des cartes trouvées
async function findAsia(tok){
  const s = search, g = s.groups.asia;
  g.loading = true;
  try {
    const count = {};
    s.groups.intl.cards.forEach(c => (c.dexId || []).forEach(d => { count[d] = (count[d] || 0) + 1; }));
    const max = Math.max(0, ...Object.values(count));
    const dex = Object.keys(count).filter(d => count[d] >= max * 0.3).sort((a, b) => count[b] - count[a]).slice(0, 3);
    const lists = await Promise.all(dex.map(d => cached(`pdex:ja:${d}`, () =>
      API.getJSON(`https://api.tcgdex.net/v2/ja/cards?dexId=eq:${d}`)).catch(() => [])));
    if (tok !== s.token) return;
    const seen = new Set();
    const has = x => x.image ? 1 : 0;
    g.briefs = lists.flat().filter(b => b && !seen.has(b.id) && seen.add(b.id)).map(b => ({ id:b.id, name:b.name, image:b.image, lang:'ja' }))
      .sort((a, b) => has(b) - has(a));
  } catch(e){ g.briefs = []; }
  g.loading = false; g.loaded = true;
  if (tok === s.token) renderResults();
}

async function loadMore(market, tok){
  const s = search, g = s.groups[market];
  const slice = g.briefs.slice(g.shown, g.shown + PAGE);
  g.shown += slice.length;
  const cards = await mapLimit(slice, 6, async b => (await API.pkmCard(b.id, b.lang)) || (b.lang === 'fr' ? await API.pkmCard(b.id, 'en') : null));
  if (tok !== s.token) return;
  cards.forEach((c, k) => g.cards.push(c || { game:'pkm', id:slice[k].id, lang:slice[k].lang, name:slice[k].name,
    img: slice[k].image ? slice[k].image + '/low.webp' : null, imgHi: slice[k].image ? slice[k].image + '/high.webp' : null,
    set:'', num:'', rarity:'', prices:{normal:null, reverse:null}, prints:null, dexId:[] }));
  g.loaded = true;
}

function resultTiles(cards){
  return `<div class="results" id="rgrid">${cards.map((c, i) => `
      <button class="tile" data-r="${i}">
        ${imgBox(c, false, marketOf(c.game, c.lang) === 'asia' ? `<span class="bdg">${esc(langLabel(c.game, c.lang))}</span>` : '')}
        <div><div class="tname">${esc(c.name)}</div><div class="tsub">${esc([c.set, c.num].filter(Boolean).join(' · ') || (c.prints ? c.prints.length + ' impression(s)' : ''))}</div></div>
        <div class="tprice"><b>${eur(c.prices.normal)}</b><span>moy.</span></div>
      </button>`).join('')}
    </div>`;
}

function renderResults(msg){
  const box = $('#sres'); if (!box) return;
  const s = search;
  if (msg){ box.innerHTML = `<div class="status">${esc(msg)}</div>`; return; }

  if (s.link){   // candidats d'un lien Cardmarket
    const n = s.linkCards.length;
    box.innerHTML = `<div class="hint" style="margin-top:12px">Pas sûr à 100 % de la carte de ce lien : choisis la bonne parmi ${n} carte${n>1?'s':''} proche${n>1?'s':''}.</div>${resultTiles(s.linkCards)}`;
    $('#rgrid').onclick = e => { const t = e.target.closest('.tile'); if (t) renderConfigure(s.linkCards[+t.dataset.r], { cmLink: s.link.url }); };
    return;
  }
  if (!s.q){ box.innerHTML = ''; return; }

  const g = s.groups[s.market];
  const cnt = m => { const x = s.groups[m]; return x.loading ? '…' : x.briefs.length; };
  const tabs = `<div class="seg" id="mtabs" style="margin-top:12px">
      ${['intl','asia'].map(m => `<button type="button" data-m="${m}" class="${s.market===m?'on':''}">${MARKET_LABEL[m]} (${cnt(m)})</button>`).join('')}
    </div>`;
  let body;
  if (s.market === 'asia' && s.game === 'ygo') body = `<div class="status">La base Yu-Gi-Oh! ne référence pas les impressions japonaises (OCG). Pour une carte OCG, colle son lien Cardmarket.</div>`;
  else if (g.loading || (!g.loaded && g.briefs.length)) body = `<div class="status">Chargement…</div>`;
  else if (!g.cards.length) body = `<div class="status">Aucune carte ${MARKET_LABEL[s.market]} trouvée pour « ${esc(s.q)} ».</div>`;
  else {
    const more = s.game === 'pkm' && g.shown < g.briefs.length;
    body = resultTiles(g.cards) + (more ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="moreBtn">Voir plus (${g.briefs.length - g.shown} restants)</button></div>` : '')
      + (s.game==='ygo' && g.cards.length>=60 ? '<div class="hint">60 premiers résultats : précise ta recherche.</div>' : '');
  }
  box.innerHTML = tabs + body;
  $('#mtabs').onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    s.market = b.dataset.m; const x = s.groups[s.market];
    if (s.game === 'pkm' && !x.cards.length && x.briefs.length){ x.loaded = false; renderResults(); const tok = s.token; await loadMore(s.market, tok); }
    renderResults(); };
  if ($('#rgrid')) $('#rgrid').onclick = e => { const t = e.target.closest('.tile'); if (t) renderConfigure(g.cards[+t.dataset.r]); };
  if ($('#moreBtn')) $('#moreBtn').onclick = async () => { $('#moreBtn').textContent = 'Chargement…'; const tok = s.token; await loadMore(s.market, tok); if (tok === s.token) renderResults(); };
}

/* ---- Ajout : étape 2, précision de la carte ---- */
function versionFields(o, card){
  const hasRev = card.prices ? card.prices.reverse != null : o.hasReverse;
  const prints = card.prints || [];
  return `
    ${card.game === 'pkm' ? `<div><label class="l">Version</label>
      <div class="seg" id="cvar"><button type="button" data-v="normal" class="${o.variant!=='reverse'?'on':''}">Normale / Holo</button>
      <button type="button" data-v="reverse" class="${o.variant==='reverse'?'on':''}" ${hasRev?'':'disabled title="Pas de prix reverse disponible"'}>Reverse</button></div></div>` : ''}
    ${prints.length ? `<div><label class="l" for="cprint">Impression (extension · rareté)</label>
      <select class="field" id="cprint" style="width:100%"><option value="">Peu importe l'impression</option>
      ${prints.map(p => `<option value="${esc(p.code)}" ${p.code===o.printCode?'selected':''}>${esc(p.code)} — ${esc(p.set)} · ${esc(p.rarity)}</option>`).join('')}</select></div>` : ''}
    <div><label class="l">État</label>
      <div class="seg" id="cgr"><button type="button" data-g="0" class="${!o.graded?'on':''}">Raw</button><button type="button" data-g="1" class="${o.graded?'on':''}">Gradée</button></div></div>
    <div class="row" id="gradeRow" style="${o.graded?'':'display:none'}">
      <div><label class="l" for="cgrader">Société</label><select class="field" id="cgrader">${GRADERS.map(g=>`<option ${g===o.grader?'selected':''}>${g}</option>`).join('')}</select></div>
      <div><label class="l" for="cgrade">Note</label><select class="field" id="cgrade">${GRADES.map(g=>`<option ${g===String(o.grade)?'selected':''}>${g}</option>`).join('')}</select></div>
      <div><label class="l" for="cgprice">Prix gradé (€)</label><input class="field num" id="cgprice" inputmode="decimal" placeholder="ex. 120" value="${o.priceGraded ?? ''}"></div>
      <div class="hint" style="flex-basis:100%">Pas de source gratuite pour les prix gradés : saisis le prix que tu as repéré (eBay, Cardmarket…).</div>
    </div>
    <div><label class="l" for="cnote">Note perso (optionnel)</label><input class="field" id="cnote" style="width:100%" placeholder="ex. pour compléter le set, édition 1…" value="${esc(o.note || '')}"></div>`;
}

function readVersionFields(o){
  const v = $('#cvar .on'); if (v) o.variant = v.dataset.v;
  if ($('#cprint')) o.printCode = $('#cprint').value;
  o.graded = $('#cgr .on').dataset.g === '1';
  o.grader = $('#cgrader').value; o.grade = $('#cgrade').value;
  o.priceGraded = num($('#cgprice').value);
  o.note = $('#cnote').value.trim();
  return o;
}

function bindVersionFields(){
  if ($('#cvar')) $('#cvar').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
    $('#cvar').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#cgr').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    $('#cgr').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    $('#gradeRow').style.display = b.dataset.g === '1' ? '' : 'none'; };
}

function withLang(link, lang){
  if (!link) return link;
  try { const u = new URL(link); if (CM_LANG[lang]) u.searchParams.set('language', CM_LANG[lang]); else u.searchParams.delete('language'); return u.href; }
  catch(e){ return link; }
}

function renderConfigure(card, pre){
  pre = pre || {};
  $('#addTitle').textContent = 'Préciser la carte';
  const o = { variant: pre.variant || 'normal', graded: !!pre.graded, grader: pre.grader || 'PSA', grade: pre.grade || '10',
              priceGraded: pre.priceGraded ?? null, note: pre.note || '', printCode: pre.printCode || '' };
  const market = marketOf(card.game, card.lang);
  const langs = MARKETS[card.game][market].includes(card.lang) ? MARKETS[card.game][market] : [card.lang, ...MARKETS[card.game][market]];
  $('#addBody').innerHTML = `<div class="detail">
    ${imgBox(card, true)}
    <div>
      <h3 style="margin:0 0 2px;font-size:22px">${esc(card.name)}</h3>
      ${card.nameJa ? `<div class="hint">Nom japonais : ${esc(card.nameJa)} · traduction automatique</div>` : ''}
      <dl class="kv">
        <dt>Jeu</dt><dd>${GAMES[card.game].label}</dd>
        <dt>Marché</dt><dd>${market === 'asia' ? 'OCG (Japon)' : 'TCG (international)'}</dd>
        ${card.set ? `<dt>Extension</dt><dd>${esc(card.set)}</dd>` : ''}
        ${card.num ? `<dt>Numéro</dt><dd>${esc(card.num)}</dd>` : ''}
        ${card.rarity ? `<dt>Rareté</dt><dd>${esc(card.rarity)}</dd>` : ''}
        <dt>Prix moyen</dt><dd><b>${eur(card.prices.normal)}</b>${card.prices.reverse != null ? ` · reverse ${eur(card.prices.reverse)}` : ''} <span class="hint">(Cardmarket)</span></dd>
      </dl>
      <div class="form">
        <div><label class="l" for="clang">Langue de la carte</label>
          <select class="field" id="clang" ${langs.length < 2 ? 'disabled' : ''}>${langs.map(l => `<option value="${l}" ${l===card.lang?'selected':''}>${esc(langLabel(card.game, l))}</option>`).join('')}</select></div>
        ${versionFields(o, card)}
      </div>
      <div class="actions">
        <button class="btn primary" id="confirmAdd">Ajouter à ma wishlist</button>
        <a class="btn" id="cfgCm" href="${esc(cmUrl({ ...card, printCode: o.printCode, cmLink: pre.cmLink }))}" target="_blank" rel="noopener">Voir sur Cardmarket</a>
        <button class="btn ghost" id="backBtn">← Retour aux résultats</button>
      </div>
    </div></div>`;
  bindVersionFields();
  // Le lien Cardmarket suit l'impression choisie (Yu-Gi-Oh!)
  if ($('#cprint')) $('#cprint').onchange = e => { pre.cmLink = null; $('#cfgCm').href = cmUrl({ ...card, printCode: e.target.value }); };
  // Changer de langue : on recharge le nom (et le visuel s'il diffère) dans cette langue, en gardant les choix déjà faits
  $('#clang').onchange = async e => {
    const lang = e.target.value; readVersionFields(o);
    $('#clang').disabled = true;
    let c2 = null;
    try { c2 = card.game === 'pkm' ? await API.pkmCard(card.id, lang) : await API.ygoCard(card.id, lang); } catch(err){}
    const next = c2 ? { ...c2, img: c2.img || card.img, imgHi: c2.imgHi || card.imgHi, prints: c2.prints || card.prints }
                    : { ...card, lang, name: card.game === 'ygo' && lang === 'en' ? (card.nameEn || card.name) : card.name };
    renderConfigure(next, { ...o, cmLink: withLang(pre.cmLink, lang) });
  };
  $('#backBtn').onclick = renderSearch;
  $('#confirmAdd').onclick = () => {
    const opts = readVersionFields(o);
    state.items.push(makeItem(card, { ...opts, cmLink: pre.cmLink })); save();
    closeModal('#addScrim'); filters = { ...filters, q:'' }; render();
    toast(`${card.name} ajoutée à ta wishlist`);
  };
}

$('#addBtn').onclick = () => { renderSearch(); openModal('#addScrim'); };

    $('#saveDet').onclick = () => {
      readVersionFields(o);
      const print = (it.prints || []).find(p => p.code === o.printCode);
      if (o.printCode !== it.printCode) it.cmLink = null;
      Object.assign(it, { variant:o.variant, graded:o.graded, grader:o.grader, grade:o.grade, priceGraded:o.priceGraded, note:o.note, printCode:o.printCode });
      if (it.game === 'ygo'){ it.set = print ? print.set : ''; it.rarity = print ? print.rarity : ''; }
      save(); closeModal('#detScrim'); render(); toast('Carte mise à jour');
      if (it.game === 'pkm') refreshOne(it).then(() => { save(); render(); });
    };
    let armed = false;
    $('#delDet').onclick = () => {
      if (!armed){ armed = true; $('#delDet').textContent = 'Confirmer la suppression'; return; }
      state.items.splice(i, 1); save(); closeModal('#detScrim'); render(); toast('Carte retirée');
    };
  }
  openModal('#detScrim');
}

/* ========= Actualisation des prix ========= */
async function refreshOne(it){
  const c = await API.card(it.game, it.id, it.lang);
  if (!c) return;
  it.priceRaw = c.prices[it.variant] ?? c.prices.normal ?? it.priceRaw;
  it.hasReverse = c.prices.reverse != null;
  it.img = c.img || it.img; it.imgHi = c.imgHi || it.imgHi; it.imgLang = c.img ? (c.imgLang || null) : it.imgLang;
  if (c.prints) it.prints = c.prints;
  if (c.cmId) it.cmId = c.cmId;
  if (c.nameEn) it.nameEn = c.nameEn;
  if (c.nameJa){ it.nameJa = c.nameJa; it.name = c.name; }
  it.refreshedAt = Date.now();
}
async function refreshPrices(){
  const b = $('#refreshBtn'); if (b){ b.disabled = true; b.textContent = 'Actualisation…'; }
  forceFresh = true;
  try { await mapLimit(state.items, 3, refreshOne); } finally { forceFresh = false; }
  save(); render(); toast('Prix actualisés');
}

/* ========= Partage par lien ========= */
// Le lien contient seulement les références des cartes ; les prix sont rechargés à l'ouverture.
function buildShareLink(){
  const payload = { o: state.owner || '', c: state.items.map(it => [it.game, it.id, it.lang, it.variant === 'reverse' ? 1 : 0, it.printCode || '',
    it.graded ? [it.grader, it.grade, it.priceGraded] : 0, it.note || '', it.cmLink || 0]) };
  return location.href.split('#')[0] + '#share=' + b64e(JSON.stringify(payload));
}
function renderShare(){
  const isFile = location.protocol === 'file:';
  $('#shareBody').innerHTML = `
    <label class="l" for="owner">Ton prénom (affiché à tes amis)</label>
    <input class="field" id="owner" style="width:100%;margin-bottom:14px" value="${esc(state.owner)}" placeholder="ex. Ivan">
    <label class="l" for="link">Lien de ta wishlist (${state.items.length} carte${state.items.length>1?'s':''})</label>
    <div class="row"><input class="field grow sharebox" id="link" readonly value="${esc(buildShareLink())}"><button class="btn primary" id="copyLink">Copier</button></div>
    <p class="hint" style="margin-top:12px">${isFile
      ? '⚠ Le site tourne en local sur ton ordinateur (fichier ouvert directement) : ce lien ne marchera pas chez tes amis tant que le site n\'est pas en ligne. Prochaine étape : le publier (GitHub Pages ou Netlify, gratuit).'
      : 'Tes amis voient la wishlist en lecture seule, avec les prix à jour.'} Le lien est une photo de ta liste : si tu ajoutes des cartes, recopie-le.</p>`;
  $('#owner').oninput = e => { state.owner = e.target.value.trim(); save(); $('#link').value = buildShareLink(); };
  $('#copyLink').onclick = async () => {
    try { await navigator.clipboard.writeText($('#link').value); toast('Lien copié'); }
    catch(e){ $('#link').select(); toast('Sélectionné — fais Ctrl+C'); }
  };
}
$('#shareBtn').onclick = () => { renderShare(); openModal('#shareScrim'); };

async function openShared(hash){
  let payload;
  try { payload = JSON.parse(b64d(hash)); } catch(e){ toast('Lien de partage invalide'); return; }
  const refs = (payload.c || []);
  shared = { owner: payload.o, items: [], loading: true };
  render();
  const items = await mapLimit(refs, 4, async ([game, id, lang, rev, printCode, gr, note, cmLink]) => {
    if (!GAMES[game]) return null;
    const c = await API.card(game, id, lang);
    if (!c) return null;
    return makeItem(c, { variant: rev ? 'reverse' : 'normal', printCode,
      graded: !!gr, grader: gr ? gr[0] : 'PSA', grade: gr ? gr[1] : '10', priceGraded: gr ? gr[2] : null, note, cmLink: cmLink || null });
  });
  shared.items = items.filter(Boolean).map((it, k) => ({ ...it, addedAt: refs.length - k }));
  shared.loading = false;
  render();
}

/* ========= Navigation & démarrage ========= */
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b){ view = b.dataset.view; render(); } };
load();
cachePrune(false);
const m = location.hash.match(/^#share=(.+)$/);
if (m) openShared(m[1]); else {
  render();
  // Complète les cartes ajoutées avant la V1.1 (identifiant Cardmarket, nom anglais)
  const old = state.items.filter(it => it.game === 'pkm' ? !it.cmId : !it.nameEn);
  if (old.length) mapLimit(old, 4, refreshOne).then(() => { save(); render(); });
}
}
</script>
